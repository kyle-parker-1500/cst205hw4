<!DOCTYPE <!DOCTYPE html>
<!-- Theme may be required to be white -->
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home</title>
    <link href="css/style.css" rel="stylesheet">
    {{ bootstrap.load_css() }}
    <h1>Kyle's Random Picture Gallery</h1>
  </head>
  <body>
    {{ bootstrap.load_js() }}
    {% for key, value in info %}
      <div class="mb-5">
        <a href="{{ url_for('detail', id=key) }}" class="h1">{{ value[0] }}</a> <br>
        <a href="{{ url_for('detail', id=key) }}">
          <img src="/static/images/{{ key }}.jpg" alt="it's not working!!!" width="500" height="500" class="rounded img-fluid">
        </a>
      </div>
    {% endfor %}
  </body>
</html>
